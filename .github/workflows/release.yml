name: Release

# Per-platform packaging and signed release artifacts (#369).
#
# - Tag push (v*)  -> build Release, package (CPack), sign if secrets are present, and attach
#                     the artifacts to a GitHub Release with generated notes.
# - Pull request that touches this workflow -> the "dry-run" path: build + package on Linux
#                     and Windows without publishing, so a packaging change is validated in CI.
# - workflow_dispatch -> manual build+package (optionally publishing to a named tag).
#
# Signing (cmake/SignPackage.cmake, run inside cpack) is driven by CI secrets and degrades cleanly to an unsigned build when they are
# absent (forks, dry runs). macOS packages as a required step since the #338/#366 toolchain
# restore; the pre-1.0 dry-run evidence is recorded in docs/RELEASE_SIGNOFF_1.0.md (#378).

on:
  push:
    tags: ['v*']
    # Release-by-commit: a push to main that changes .github/release-request (a file whose
    # sole content is the version, e.g. "v1.0.0") packages and publishes that version, with
    # the tag created by the publish job. This is the path for release environments that can
    # merge PRs but cannot push tags or dispatch workflows. Tags made with the workflow's
    # own GITHUB_TOKEN do not re-trigger this workflow, so it cannot loop.
    branches: [main]
    paths: ['.github/release-request']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp/publish (e.g. v1.0.0). Blank = build only.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: Package - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # All platforms package as a required step now that the clang-21 toolchain is restored
    # (#366 / #338): macOS builds the full engine, so its package is no longer informational.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
        include:
          - os: ubuntu-latest
            cmake_generator: "Unix Makefiles"
          - os: windows-2022
            cmake_generator: "Visual Studio 17 2022"
          - os: macos-latest
            cmake_generator: "Unix Makefiles"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Derive version
      id: ver
      shell: bash
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          V="${{ github.ref_name }}"
        elif [ -n "${{ github.event.inputs.version }}" ]; then
          V="${{ github.event.inputs.version }}"
        elif [ "${{ github.event_name }}" = "push" ] && [ -s .github/release-request ]; then
          V="$(tr -d '[:space:]' < .github/release-request)"
        else
          V="0.0.0-dryrun"
        fi
        echo "version=${V#v}" >> "$GITHUB_OUTPUT"   # strip a leading v for the package version
        echo "release_tag=${V}" >> "$GITHUB_OUTPUT" # full tag (empty/dryrun means build-only)

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libx11-dev \
          mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev libopenal-dev pkg-config

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install openal-soft pkg-config
        echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

    - name: Setup vcpkg (Windows)
      if: matrix.os == 'windows-2022'
      uses: lukka/run-vcpkg@v11
      with:
        runVcpkgInstall: true
        vcpkgJsonGlob: 'vcpkg.json'
      continue-on-error: true

    - name: Configure (Unix)
      if: matrix.os != 'windows-2022'
      run: >
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=Release
        -G "${{ matrix.cmake_generator }}"
        -DIKORE_RELEASE_VERSION="${{ steps.ver.outputs.version }}"

    - name: Configure (Windows)
      if: matrix.os == 'windows-2022'
      shell: pwsh
      run: |
        if ($env:VCPKG_ROOT -and (Test-Path "$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake")) {
          cmake -S . -B build -G "${{ matrix.cmake_generator }}" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DIKORE_RELEASE_VERSION="${{ steps.ver.outputs.version }}"
        } else {
          cmake -S . -B build -G "${{ matrix.cmake_generator }}" -A x64 `
            -DIKORE_RELEASE_VERSION="${{ steps.ver.outputs.version }}"
        }

    - name: Build IKore (Unix)
      if: matrix.os != 'windows-2022'
      run: cmake --build build --target IKore -j$(nproc 2>/dev/null || echo 4)

    - name: Build IKore (Windows)
      if: matrix.os == 'windows-2022'
      run: cmake --build build --config Release --target IKore --parallel

    # Signing credentials (#419). Each step is a no-op without its secrets, so forks and PR
    # dry-runs still package unsigned. With them, cmake/SignPackage.cmake signs the staged
    # executable inside cpack (after CPACK_STRIP_FILES), and the verify steps below fail the
    # job if the shipped binary is not actually signed.
    #   macOS:   MACOS_CERTIFICATE_P12 (base64 .p12), MACOS_CERTIFICATE_PASSWORD,
    #            MACOS_SIGNING_IDENTITY, and for notarization APPLE_ID, APPLE_TEAM_ID,
    #            APPLE_APP_PASSWORD (app-specific password).
    #   Windows: WINDOWS_CERTIFICATE_PFX (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD.
    - name: Import macOS signing certificate
      if: matrix.os == 'macos-latest'
      shell: bash
      env:
        MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        MACOS_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      run: |
        if [ -z "$MACOS_CERT" ] || [ -z "$MACOS_IDENTITY" ]; then
          echo "No macOS signing secrets; packaging unsigned (fork/dry-run fallback)."
          exit 0
        fi
        KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
        echo "$MACOS_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        rm -f "$RUNNER_TEMP/cert.p12"
        echo "IKORE_CODESIGN_IDENTITY=$MACOS_IDENTITY" >> "$GITHUB_ENV"
        echo "IKORE_EXPECT_SIGNED=1" >> "$GITHUB_ENV"

    - name: Prepare Windows signing certificate
      if: matrix.os == 'windows-2022'
      shell: pwsh
      env:
        WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      run: |
        if (-not $env:WINDOWS_CERT) {
          Write-Host "No Windows signing secret; packaging unsigned (fork/dry-run fallback)."
          exit 0
        }
        $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT))
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
        "IKORE_SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
        "IKORE_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
        "IKORE_SIGN_PFX_PASSWORD=$env:WINDOWS_CERT_PASSWORD" >> $env:GITHUB_ENV
        "IKORE_EXPECT_SIGNED=1" >> $env:GITHUB_ENV

    - name: Package (CPack)
      shell: bash
      working-directory: build
      run: |
        if [ "${{ matrix.os }}" = "windows-2022" ]; then
          cpack -C Release -G ZIP
        else
          cpack -G TGZ
        fi
        ls -la IKoreEngine-* || true

    - name: Verify and notarize macOS package
      if: matrix.os == 'macos-latest' && env.IKORE_EXPECT_SIGNED == '1'
      shell: bash
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      run: |
        set -euo pipefail
        CHECK="$RUNNER_TEMP/pkgcheck"
        mkdir -p "$CHECK"
        tar -xzf build/IKoreEngine-*.tar.gz -C "$CHECK"
        BIN="$(find "$CHECK" -type f -name IKore | head -1)"
        codesign --verify --strict --verbose=2 "$BIN"
        codesign -dv "$BIN" 2>&1 | grep -E 'Authority|TeamIdentifier|flags'
        if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
          echo "::warning::Signed but not notarized: APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD not set."
          exit 0
        fi
        # notarytool does not accept .tar.gz; submit a zip of the same signed binary. A bare
        # executable cannot be stapled, so Gatekeeper checks the ticket online on first run.
        ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/IKore-notarize.zip"
        xcrun notarytool submit "$RUNNER_TEMP/IKore-notarize.zip" \
          --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
          --wait --timeout 30m

    - name: Verify Windows package signature
      if: matrix.os == 'windows-2022' && env.IKORE_EXPECT_SIGNED == '1'
      shell: pwsh
      run: |
        $check = Join-Path $env:RUNNER_TEMP "pkgcheck"
        $zip = Get-ChildItem build\IKoreEngine-*.zip | Select-Object -First 1
        Expand-Archive $zip.FullName -DestinationPath $check -Force
        $exe = Get-ChildItem $check -Recurse -Filter IKore.exe | Select-Object -First 1
        & $env:IKORE_SIGNTOOL verify /pa /v $exe.FullName
        if ($LASTEXITCODE -ne 0) { throw "Packaged IKore.exe is not validly signed" }
        Remove-Item $env:IKORE_SIGN_PFX -Force

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: ikore-package-${{ matrix.os }}
        path: build/IKoreEngine-*
        retention-days: 30
        if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: package
    # A tag push publishes, as does a workflow_dispatch that names a version and a push to
    # main that changes .github/release-request (the manual publish paths: gh release create
    # makes the tag itself when it does not exist yet). A PR dry-run or a build-only
    # dispatch stops after packaging.
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        DISPATCH_VERSION: ${{ github.event.inputs.version }}
      shell: bash
      run: |
        shopt -s globstar nullglob
        files=(dist/**/IKoreEngine-*)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No package artifacts found to attach." >&2
          exit 1
        fi
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          TAG="${GITHUB_REF_NAME}"
        elif [ -n "${DISPATCH_VERSION}" ]; then
          TAG="${DISPATCH_VERSION}"   # manual publish: the tag is created at GITHUB_SHA
        elif [ -s .github/release-request ]; then
          TAG="$(tr -d '[:space:]' < .github/release-request)"
        else
          echo "No version requested (.github/release-request is empty); build-only."
          exit 0
        fi
        if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          echo "Release ${TAG} already exists; not recreating."
          exit 0
        fi
        echo "Attaching ${#files[@]} artifact(s) to ${TAG}: ${files[*]}"
        gh release create "${TAG}" "${files[@]}" \
          --repo "${GITHUB_REPOSITORY}" \
          --target "${GITHUB_SHA}" \
          --title "Charta ${TAG} (Doodlebound)" \
          --generate-notes
