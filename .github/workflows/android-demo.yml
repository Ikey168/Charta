name: Android demo

on:
  push:
    branches: [main]
    tags: ['doodlebound-v*']
    paths:
      - 'android/**'
      - 'src/mobile/**'
      - 'src/doodle/**'
      - 'src/cv/**'
      - 'src/game/**'
      - 'scripts/android-demo-*.sh'
      - '.github/workflows/android-demo.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/mobile/**'
      - 'src/doodle/**'
      - 'src/cv/**'
      - 'src/game/**'
      - 'scripts/android-demo-*.sh'
      - '.github/workflows/android-demo.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Signed demo versionCode (must exceed the last shipped code). Blank = debug smoke only.'
        required: false
        default: ''
      version_name:
        description: 'Signed demo versionName, e.g. 0.1.3-demo'
        required: false
        default: ''

jobs:
  build-and-smoke:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android toolchain
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' 'platform-tools'
      - name: Build both ABI variants
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Check APK libraries
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | tee android-apk-inventory.txt
          grep -F 'lib/arm64-v8a/libdoodlebound.so' android-apk-inventory.txt
          grep -F 'lib/x86_64/libdoodlebound.so' android-apk-inventory.txt
      # Hosted runners expose /dev/kvm, but only root can open it until this rule is
      # installed. Without it the emulator falls back to software emulation: boot takes
      # 10+ minutes and the package/activity services die mid-install.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Emulator launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 900
          disable-animations: true
          script: sh scripts/android-demo-emulator-smoke.sh
      - name: Upload APK and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doodlebound-android-api${{ matrix.api-level }}-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/logs/**
            android/app/build/outputs/androidTest-results/**
            android-apk-inventory.txt
            android-logcat.txt
            android-activities.txt
          if-no-files-found: warn

  # Reproducible signed demo APK (A25 / #446). Runs the same scripts/android-demo-package.sh an
  # operator runs locally, from a clean checkout with the pinned toolchain, and archives the
  # APK, unstripped native symbols, SHA256SUMS, BUILD.txt and the static verification output.
  # Triggered by a manual dispatch with a version_code, or by a doodlebound-v<name>+<code> tag
  # (e.g. doodlebound-v0.1.3-demo+4). Needs secrets DOODLEBOUND_KEYSTORE_BASE64,
  # DOODLEBOUND_KEY_ALIAS, DOODLEBOUND_STORE_PASSWORD and DOODLEBOUND_KEY_PASSWORD; the
  # keystore never touches the checkout.
  signed-demo:
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version_code != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Install pinned Android toolchain
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' 'platform-tools'
      - name: Resolve version
        id: ver
        env:
          INPUT_CODE: ${{ github.event.inputs.version_code }}
          INPUT_NAME: ${{ github.event.inputs.version_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            spec="${GITHUB_REF_NAME#doodlebound-v}"
            name="${spec%+*}"; code="${spec##*+}"
          else
            code="$INPUT_CODE"; name="${INPUT_NAME:-0.1.$INPUT_CODE-demo}"
          fi
          case "$code" in ''|*[!0-9]*) echo "versionCode must be a positive integer (got '$code')" >&2; exit 2;; esac
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Build, sign and archive
        env:
          KEYSTORE_B64: ${{ secrets.DOODLEBOUND_KEYSTORE_BASE64 }}
          DOODLEBOUND_KEY_ALIAS: ${{ secrets.DOODLEBOUND_KEY_ALIAS }}
          DOODLEBOUND_STORE_PASSWORD: ${{ secrets.DOODLEBOUND_STORE_PASSWORD }}
          DOODLEBOUND_KEY_PASSWORD: ${{ secrets.DOODLEBOUND_KEY_PASSWORD }}
          DOODLEBOUND_VERSION_CODE: ${{ steps.ver.outputs.code }}
          DOODLEBOUND_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DOODLEBOUND_KEYSTORE_BASE64 is not configured; cannot produce a signed demo."
            exit 1
          fi
          export DOODLEBOUND_KEYSTORE="$RUNNER_TEMP/doodlebound-release.jks"
          echo "$KEYSTORE_B64" | base64 --decode > "$DOODLEBOUND_KEYSTORE"
          out="$(scripts/android-demo-package.sh | tail -1)"
          rm -f "$DOODLEBOUND_KEYSTORE"
          echo "ARTIFACT_DIR=$out" >> "$GITHUB_ENV"
          {
            echo "## Signed Doodlebound demo"
            echo
            echo '```'
            cat "$out/BUILD.txt"
            echo
            cat "$out/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed demo
        uses: actions/upload-artifact@v4
        with:
          name: doodlebound-demo-v${{ steps.ver.outputs.code }}-${{ github.sha }}
          path: ${{ env.ARTIFACT_DIR }}
          retention-days: 90
          if-no-files-found: error
