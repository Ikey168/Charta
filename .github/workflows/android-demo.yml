name: Android demo

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/mobile/**'
      - 'src/doodle/**'
      - 'src/cv/**'
      - 'src/game/**'
      - '.github/workflows/android-demo.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/mobile/**'
      - 'src/doodle/**'
      - 'src/cv/**'
      - 'src/game/**'
      - '.github/workflows/android-demo.yml'
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android toolchain
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' 'platform-tools'
      - name: Build both ABI variants
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Check APK libraries
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | tee android-apk-inventory.txt
          grep -F 'lib/arm64-v8a/libdoodlebound.so' android-apk-inventory.txt
          grep -F 'lib/x86_64/libdoodlebound.so' android-apk-inventory.txt
      - name: Emulator launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: |
            set -eu
            trap 'adb logcat -d -v time > "$GITHUB_WORKSPACE/android-logcat.txt"; adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/android-activities.txt"' EXIT
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.ikore.doodlebound/.MainActivity
            sleep 8
            adb shell pidof com.ikore.doodlebound
            cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest && cd ..
            adb shell dumpsys activity activities > android-activities.txt
            grep -F 'com.ikore.doodlebound' android-activities.txt
      - name: Upload APK and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doodlebound-android-api${{ matrix.api-level }}-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/logs/**
            android/app/build/outputs/androidTest-results/**
            android-apk-inventory.txt
            android-logcat.txt
            android-activities.txt
          if-no-files-found: warn
